<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>Casey Practice Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Layout: replica of the online-case chatbot screen. Dark sidebar (camera, exhibit thumbnails, support),
   grey top bar (progress, time left, green Submit), white rounded chat panel with composer.
   Single committed look: the real test has one theme, so this page does too. */
:root{
  color-scheme:light;
  --side:#2f303b; --side-foot:#55565b; --top:#ececec; --panel:#ffffff; --page:#ececec;
  --ink:#2a2c33; --muted:#8b9099; --line:#e2e5ea;
  --cyan:#41b2e2; --blue:#2e8fd8; --blue-dark:#1f6fb0; --green:#2fb72f; --green-dark:#249424;
  --input:#e8f1fb; --ex-a:#c9ead6; --ex-b:#eef3f0; --ex-line:#7f8a84;
  --good:#1e8a4c; --good-soft:#e2f4ea; --bad:#c23b34; --bad-soft:#fbe8e6; --warn:#a56a00; --warn-soft:#fdf1d8;
  --video:#525252;
  --f:"Mulish","Muli","Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pillbtn{border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:700;padding:7px 18px;font-size:13px}
.pillbtn:hover{background:var(--green-dark)}
.pillbtn.blue{background:var(--blue)} .pillbtn.blue:hover{background:var(--blue-dark)}
.pillbtn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.pillbtn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eef0f3;color:#5c626c}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ---------- Home ---------- */

/* ---------- Run (replica layout) ---------- */
#run{height:100%;display:grid;grid-template-columns:172px minmax(0,1fr)}
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.side-logo{background:#fff;height:70px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:15px;color:#1c6f8f;flex:none}
.side-logo i{width:20px;height:20px;border-radius:6px 6px 6px 2px;background:#1c6f8f;display:inline-block;position:relative}
.side-logo i::after{content:"";position:absolute;inset:6px 5px;border-radius:2px;background:#fff}
.side-logo span b{font-weight:400;color:#2aa3b8}
.cam{margin:14px 16px 6px;aspect-ratio:1/1;background:#1f2028;border-radius:2px;overflow:hidden;position:relative;display:grid;place-items:center;flex:none}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .ph{color:#8f93a3;font-size:10.5px;text-align:center;padding:8px;line-height:1.35}
.cam .ph svg{display:block;margin:0 auto 6px}
.thumbs{flex:1;min-height:0;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.thumb{border:0;padding:0;background:#fff;border-radius:2px;overflow:hidden;height:74px;flex:none;position:relative;text-align:left}
.thumb .mini{zoom:.28;width:520px;pointer-events:none;padding:8px}
.thumb::after{content:attr(data-id);position:absolute;left:0;top:0;background:var(--blue);color:#fff;font-size:9px;font-weight:700;padding:1px 5px}
.side-foot{background:var(--side-foot);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;flex:none}
.side-foot button{background:transparent;border:0;color:#e9e9ee;font-size:11.5px;display:flex;align-items:center;gap:8px;padding:2px 0;opacity:.85}
.side-foot button:hover{opacity:1}
.side-foot .ico{width:24px;height:24px;border-radius:50%;background:#33343a;display:grid;place-items:center;flex:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{flex:none;display:flex;align-items:center;gap:14px;padding:14px 22px 8px 26px;padding-right:max(22px,env(safe-area-inset-right,0px))}
.prog{flex:0 1 300px;min-width:90px}
.prog-track{height:10px;border-radius:999px;background:#fff;overflow:hidden}
.prog-fill{height:100%;border-radius:999px;background:var(--cyan);transition:width .5s ease;width:0}
.prog-label{font-size:11px;font-weight:700;margin-top:4px;padding-left:6px}
.refresh{border:0;background:transparent;font-size:15px;line-height:1;padding:2px;align-self:flex-start;margin-top:-3px}
.m-only{display:none}
.timeleft{margin-left:auto;font-weight:700;font-size:15px;color:#555a63;white-space:nowrap;font-variant-numeric:tabular-nums}
.timeleft.crit{color:var(--bad)}
.panel{flex:1;min-height:0;background:var(--panel);border-radius:44px 44px 0 0;margin:0 14px 0 18px;margin-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;overflow:hidden}
.chat{flex:1;min-height:0;overflow-y:auto;padding:26px 30px 18px}
.chat-in{max-width:900px;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:12px;align-items:flex-start;max-width:min(680px,92%)}
.bot-ico{flex:none;width:20px;height:20px;border-radius:6px 6px 6px 2px;background:var(--blue);position:relative;margin-top:7px}
.bot-ico::before,.bot-ico::after{content:"";position:absolute;top:6px;width:4px;height:2px;border-radius:2px 2px 0 0;border-top:1.5px solid #fff}
.bot-ico::before{left:4px}.bot-ico::after{right:4px}
.bot-ico i{position:absolute;left:5px;right:5px;bottom:5px;height:2px;background:#fff;border-radius:2px}
.bubble{background:#fff;border-radius:12px;padding:9px 14px;box-shadow:0 2px 8px rgba(40,50,70,.13);min-width:0;font-size:13.5px}
.bubble p{margin:0}
.bubble .qt{font-weight:800;margin-bottom:6px}
.bubble .qleft{font-weight:600;color:var(--muted);font-size:11.5px;margin-left:8px}
.ts{font-size:9.5px;color:#a4a8b0;margin:1px 0 8px 32px}
.msg.user{align-self:flex-end;flex-direction:column;align-items:flex-end;gap:5px;max-width:min(560px,85%)}
.upill{background:var(--blue);color:#fff;border-radius:999px;padding:5px 16px;font-size:12.5px;font-weight:700;box-shadow:0 2px 6px rgba(46,143,216,.35)}
.utext{background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 6px rgba(46,143,216,.3)}
.ts.right{align-self:flex-end;margin:1px 4px 8px 0}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#b9bfc9;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.choices{margin:4px 0 4px 32px;display:flex;flex-direction:column;gap:7px;max-width:min(640px,calc(100% - 32px))}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;gap:8px;align-items:center;border:1.5px solid var(--blue);border-radius:999px;padding:6px 16px;background:#fff;font-size:12.5px}
.opt:hover{border-color:var(--blue)}
.opt.on{background:var(--blue)}
.opt.on .k{color:#fff}
.opt .k{font-weight:800;color:var(--blue)}
.opt .ord{flex:none;width:20px;height:20px;border-radius:50%;background:#e3e8ee;color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center;margin-top:1px}
.opt.on .ord{background:#fff;color:var(--blue)}
.choices .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}
.composer{flex:none;padding:6px 30px calc(12px + env(safe-area-inset-bottom,0px)) 62px}
.composer-in{display:flex;gap:10px;align-items:flex-end;max-width:900px}
.composer textarea,.composer input{flex:1;min-width:0;font:inherit;font-size:14px;background:var(--input);border:0;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(40,50,70,.15);color:var(--ink);resize:none}
.composer textarea{height:84px}
.composer ::placeholder{color:#7c8794}
.send{border:0;background:transparent;padding:4px;flex:none}
.send svg{display:block}
.send:disabled{opacity:.35;cursor:not-allowed}
.composer-meta{display:flex;justify-content:space-between;gap:10px;max-width:900px;font-size:10.5px;color:#7c8794;margin-top:4px;padding-right:38px}
.composer-meta .err{color:var(--bad);font-weight:700}

/* exhibits */
.exhibit{background:#fff;border:3px solid #d9dcdf;box-shadow:inset 0 0 0 1px var(--ex-line);padding:10px;min-width:0;max-width:100%}
.ex-title{font-weight:800;font-size:12.5px;margin-bottom:7px}
.ex-note{font-size:11px;color:#646a74;margin-top:7px}
.ex-scroll{overflow-x:auto}
table.ex{border-collapse:collapse;width:100%;font-size:12px;border:1px solid var(--ex-line)}
table.ex th,table.ex td{padding:5px 8px;text-align:right;border-right:1px solid var(--ex-line);font-variant-numeric:tabular-nums;vertical-align:top}
table.ex th:first-child,table.ex td:first-child{text-align:left;min-width:110px}
table.ex th:last-child,table.ex td:last-child{border-right:0}
table.ex.desc td:last-child{text-align:left;min-width:220px}
table.ex th{background:var(--ex-a);font-weight:800;border-bottom:1px solid var(--ex-line)}
table.ex tbody tr:nth-child(odd){background:var(--ex-b)}
table.ex tbody tr:nth-child(even){background:var(--ex-a)}
button.exbtn{border:0;background:transparent;padding:0;text-align:left;display:block;max-width:100%;cursor:zoom-in}
.legend{display:flex;gap:14px;font-size:11px;color:#646a74;margin-bottom:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;min-width:260px;max-width:460px;height:auto;display:block}
svg.chart text{fill:#646a74;font-family:var(--f);font-size:11px}
svg.chart text.val{fill:var(--ink);font-weight:700;font-size:10.5px}
svg.chart line.grid{stroke:#dfe3e6;stroke-width:1}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(30,30,36,.55);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:#fff;border-radius:6px;max-width:440px;width:100%;padding:26px 26px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;position:relative;max-height:calc(100% - 20px);overflow:auto}
.modal.wide{max-width:760px;text-align:left;align-items:stretch}
.modal h2{font-size:19px}
.modal p{margin:0;font-size:13px;color:#555a63}
.modal ul{margin:0;padding-left:18px;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:6px}
.modal .x{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;border:0;background:#e2392f;color:#fff;font-weight:800;font-size:12px;line-height:1}
.modal .link{background:none;border:0;text-decoration:underline;font-size:12px;color:#555a63}
.modal .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.illus{width:120px;height:84px;border-radius:12px;background:var(--input);display:grid;place-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:#2a2c33;color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;font-size:12.5px;z-index:40;max-width:calc(100% - 32px);text-align:center}

/* ---------- Video ---------- */
#video{height:100%;display:flex;flex-direction:column}
.vpanel{flex:1;min-height:0;background:var(--video);border-radius:36px 36px 0 0;margin:0 14px;padding:14px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;overflow-y:auto}
.vq{align-self:stretch;display:flex;gap:12px;align-items:flex-start}
.vq .bubble{flex:1;border-radius:16px;padding:14px 18px;color:#1f6f9f;font-size:14px}
.vq .qt{color:#1f6f9f}
.vinfo{text-align:center;font-size:12.5px;line-height:1.7}
.vcount{font-size:13px;font-weight:700;padding:6px 16px;border-radius:4px;display:flex;align-items:center;gap:8px}
.vcount.rec{background:rgba(194,59,52,.25)}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#ff5a4f;animation:blink 1s infinite}
.vcam{width:min(360px,80%);aspect-ratio:4/3;background:#2f303b;display:grid;place-items:center;overflow:hidden;flex:none}
.vcam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.vcam .ph{color:#b9bcc8;font-size:12px;text-align:center;padding:16px;max-width:300px}
.vcam .ph svg{display:block;margin:0 auto 8px}

/* ---------- Results ---------- */
#results{max-width:920px;margin:0 auto;padding-block:26px 56px;display:flex;flex-direction:column;gap:18px}
.score-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.stat{background:#fff;border-radius:14px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.rq{background:#fff;border-left:5px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rq.good{border-left-color:var(--good)} .rq.bad{border-left-color:var(--bad)} .rq.part{border-left-color:#e0a422}
.rq-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rq-h h3{font-size:14.5px;font-weight:700;flex:1;min-width:200px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.cmp > div{background:#f4f6f8;border-radius:10px;padding:10px 12px;min-width:0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.cmp .lab{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px;white-space:normal}
.solution{font-size:13.5px;background:var(--input);border-radius:10px;padding:10px 12px}
.checklist{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.checklist label{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.checklist input{margin-top:3px;accent-color:var(--blue)}
details.ex-all{background:#fff;border-radius:14px;padding:14px 16px}
details.ex-all summary{cursor:pointer;font-weight:700}
details.ex-all > div{display:flex;flex-direction:column;gap:12px;margin-top:12px;align-items:flex-start}
.playback{width:min(360px,100%);border-radius:8px;background:#000}

@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media (max-width:860px){
  #run{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .m-only{display:inline-flex}
  .topbar{padding:10px 12px 6px;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .panel{margin:0 6px;border-radius:26px 26px 0 0}
  .chat{padding:18px 14px 12px}
  .composer{padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px)) 14px}
  .choices{margin-left:0;max-width:100%}
  .ts{margin-left:32px}
  .timeleft{font-size:13px}
  .timeleft span{display:none}
  .topbar .pillbtn{padding:6px 12px}
  .iconbtn{border:0;background:#fff;border-radius:999px;font-size:11.5px;font-weight:700;padding:6px 10px;align-items:center;gap:4px}
  .vpanel{margin:0 6px;border-radius:26px 26px 0 0}
  .msg{max-width:100%}
}

/* ===== Assessmint design system (navy), scoped to .am ===== */
@font-face{font-family:"Geist";src:url(fonts/geist.woff2) format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader.woff2) format("woff2");font-style:normal;font-weight:200 800;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader-italic.woff2) format("woff2");font-style:italic;font-weight:200 800;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono.woff2) format("woff2");font-style:normal;font-weight:100 800;font-display:swap}
.am {
  --bg: #edf1f8; --bg-a: #cddbf3; --bg-b: #d3e2f5; --bg-c: #e4e6f6;
  --surface: #ffffff; --surface-2: #f4f7fc;
  --glass: rgba(255, 255, 255, .58); --glass-strong: rgba(255, 255, 255, .84);
  --glass-border: rgba(255, 255, 255, .85); --glass-edge: rgba(12, 40, 100, .09);
  --fg: #0b1530; --muted: #4a5a7a; --line: rgba(15, 40, 95, .13);
  --accent: #1f4fa8; --accent-2: #5b8def; --accent-deep: #0f2a66; --accent-fg: #ffffff; --accent-soft: rgba(40, 90, 200, .12);
  --grad: linear-gradient(135deg, #4f7fe0 0%, #1f4fa8 48%, #0d2a6b 100%);
  --grad-text: linear-gradient(120deg, #0f2a66 0%, #1f4fa8 55%, #3b82c4 100%);
  --grad-warm: linear-gradient(135deg, #fcd34d 0%, #f5b02a 48%, #e08a0b 100%); --warm-fg: #3a2200;
  --sh-btn-warm: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 -1px 0 rgba(0, 0, 0, .08) inset, 0 6px 16px -4px rgba(217, 119, 6, .45), 0 2px 4px rgba(217, 119, 6, .2);
  --good: #0f8a4f; --good-soft: rgba(16, 163, 92, .13); --bad: #c0362c; --bad-soft: rgba(220, 60, 50, .11); --warn: #a35f00; --warn-soft: rgba(230, 150, 20, .14);
  --s1: #1f4fa8; --s2: #0e9aa0; --s3: #e8890c; --s4: #8b5cf6;
  --sh-sm: 0 1px 2px rgba(10, 25, 60, .06), 0 2px 8px rgba(10, 25, 60, .05);
  --sh: 0 2px 6px rgba(10, 25, 60, .05), 0 12px 32px -8px rgba(10, 25, 60, .14);
  --sh-lg: 0 4px 12px rgba(10, 25, 60, .06), 0 28px 60px -16px rgba(10, 25, 60, .22);
  --sh-btn: 0 1px 0 rgba(255, 255, 255, .45) inset, 0 -1px 0 rgba(0, 0, 0, .08) inset, 0 6px 16px -4px rgba(20, 60, 150, .45), 0 2px 4px rgba(20, 60, 150, .2);
  --hi: inset 0 1px 0 rgba(255, 255, 255, .9);
  --r: 20px; --r-sm: 14px;
  --font-body: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-display: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .am {
  --bg: #050b1a; --bg-a: #0b2150; --bg-b: #0a1f3d; --bg-c: #16193a;
  --surface: #0c1730; --surface-2: #0f1d3a;
  --glass: rgba(18, 32, 66, .55); --glass-strong: rgba(14, 26, 56, .86);
  --glass-border: rgba(255, 255, 255, .10); --glass-edge: rgba(0, 0, 0, .35);
  --fg: #e8eefb; --muted: #9aaacb; --line: rgba(255, 255, 255, .10);
  --accent: #7aa2ff; --accent-2: #a5c0ff; --accent-deep: #c7d7ff; --accent-fg: #06112b; --accent-soft: rgba(122, 162, 255, .16);
  --grad: linear-gradient(135deg, #a5c0ff 0%, #7aa2ff 45%, #4f7fe0 100%);
  --grad-text: linear-gradient(120deg, #c7d7ff 0%, #7aa2ff 55%, #67d4e0 100%);

/* ================= COLOR THEME (v9) — vivid palette inspired by the Bain simulator ================= */
:root{
  --pink:#1f4fa8; --violet:#1f4fa8; --sky:#3b82c4; --mint:#14a06b; --orange:#e8890c; --amber:#e08e00;
  --cyan:#3b6fd8; --blue:#1f4fa8; --blue-dark:#163d85; --green:#14b87d; --green-dark:#0f9a68;
  --input:#eef3fc; --side:#0d1f4a; --side-foot:#15295e; --page:#edf1f8; --top:#edf1f8;
  --ex-a:#dfe8f8; --ex-b:#f3f6fc; --ex-line:#8a9bc4;
  --grad:linear-gradient(135deg,#4f7fe0 0%,#1f4fa8 48%,#0d2a6b 100%);
  --f:"Geist","Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
body{background:var(--page)}

.pillbtn.blue{background:var(--violet)} .pillbtn.blue:hover{background:var(--blue-dark)}
.pillbtn.ghost{background:#fff;box-shadow:none;border:1.5px solid #d6dff0}
.pillbtn.ghost:hover{background:#fff;border-color:var(--violet);color:var(--violet);transform:none}
#end-btn,#vend{background:var(--mint);box-shadow:0 4px 14px rgba(20,184,125,.35)}
#end-btn:hover,#vend:hover{background:var(--green-dark)}

/* home hero */

/* section headers */

.side{background:linear-gradient(180deg,#0d1f4a 0%,#12285e 60%,#1b3a7a 100%)}

.thumb::after{background:var(--pink)}

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('case-data').textContent);
const CASES = DATA.cases;
const HKEY = 'casey-practice-history-v1';
const AKEY = 'casey-practice-active-v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const caseById = (id) => CASES.find(c => c.id === id);
const fmtClock = (sec) => { sec = Math.max(0, Math.ceil(sec)); return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); };
const fmtNum = (n, d) => Number(n).toLocaleString('en-GB', {minimumFractionDigits: d ?? 0, maximumFractionDigits: d ?? 2});
const fmtDate = (ms) => new Date(ms).toLocaleString('en-GB', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
const fmtTs = (ms) => { const d = new Date(ms || Date.now()); let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return String(h).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ap; };
const ACKS = ['Thanks', 'Great!', 'Thank you', 'Noted, thank you'];

/* ---------------- Custom cases: create with AI / upload JSON ----------------
   Custom cases live only in this browser (localStorage). No AI API is called: the user copies a
   prompt into their own AI chat and pastes the answer back. */
const CKEY = 'casey-custom-cases-v1';
const BUILTIN_IDS = new Set(CASES.map(c => c.id));
function loadCustom(){ const arr = store.get(CKEY, []); return Array.isArray(arr) ? arr.filter(c => { try { validateCase(c); return true; } catch(e) { return false; } }) : []; }
function saveCustom(){ store.set(CKEY, CASES.filter(c => c.custom)); }
function slug(s){ return String(s || 'case').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'case'; }

function validateCase(c){
  const err = (m) => { throw new Error(m); };
  if (!c || typeof c !== 'object') err('The case is not a JSON object.');
  for (const k of ['id','title','summary']) if (typeof c[k] !== 'string' || !c[k].trim()) err('Missing "' + k + '".');
  if (!Array.isArray(c.intro) || !c.intro.length) err('"intro" must be a non-empty list of messages.');
  if (!c.exhibits || typeof c.exhibits !== 'object') err('Missing "exhibits".');
  for (const [id, e] of Object.entries(c.exhibits)) {
    if (e.kind === 'table') { if (!Array.isArray(e.columns) || !Array.isArray(e.rows)) err('Exhibit ' + id + ': a table needs "columns" and "rows".'); }
    else if (e.kind === 'bar') { if (!Array.isArray(e.categories) || !Array.isArray(e.series) || !e.series.every(s => Array.isArray(s.values) && s.values.length === e.categories.length && s.values.every(v => typeof v === 'number'))) err('Exhibit ' + id + ': a bar chart needs "categories" and numeric "series" of the same length.'); }
    else err('Exhibit ' + id + ': kind must be "table" or "bar".');
  }
  if (!Array.isArray(c.questions) || c.questions.length < 4) err('A case needs at least 4 questions.');
  const qids = new Set();
  c.questions.forEach((q, i) => {
    const where = 'Question ' + (i+1) + ': ';
    if (!q.id || qids.has(q.id)) err(where + 'missing or repeated "id".'); qids.add(q.id);
    if (typeof q.prompt !== 'string' || !q.prompt.trim()) err(where + 'missing "prompt".');
    if (!(q.expectedMin > 0) || !(q.weight > 0)) err(where + '"expectedMin" and "weight" must be positive numbers.');
    (q.before || []).forEach(b => { if (b.exhibit && !c.exhibits[b.exhibit]) err(where + 'refers to exhibit "' + b.exhibit + '", which does not exist.'); });
    const ids = (q.options || []).map(o => o.id);
    if (['single','multi','rank'].includes(q.type)) {
      if (ids.length < 3 || new Set(ids).size !== ids.length || !q.options.every(o => o.text)) err(where + 'needs at least 3 options with unique ids and text.');
      if (q.type === 'single' && !ids.includes(q.correct)) err(where + '"correct" must be one option id.');
      if (q.type === 'multi' && !(Array.isArray(q.correct) && q.correct.length && q.correct.every(x => ids.includes(x)))) err(where + '"correct" must list valid option ids.');
      if (q.type === 'rank' && !(Array.isArray(q.correct) && q.correct.length === ids.length && q.correct.every(x => ids.includes(x)))) err(where + '"correct" must rank every option.');
    } else if (q.type === 'numeric') {
      if (typeof q.answer !== 'number' || typeof q.tolerance !== 'number') err(where + 'numeric questions need a numeric "answer" and "tolerance".');
    } else if (q.type === 'text') {
      if (!Array.isArray(q.checklist) || !q.checklist.length) err(where + 'text questions need a "checklist".');
    } else err(where + 'unknown type "' + q.type + '".');
  });
  if (!c.video || typeof c.video.prompt !== 'string' || !Array.isArray(c.video.checklist)) err('Missing "video" with "prompt" and "checklist".');
  return true;
}
function normaliseCase(c){
  c = JSON.parse(JSON.stringify(c));
  c.timeLimitMin = 35;
  c.problem = c.problem || 'Custom case'; c.industry = c.industry || 'Other';
  c.video.weight = c.video.weight || 1; c.video.modelAnswer = c.video.modelAnswer || '';
  c.questions.forEach(q => { delete q.legacy; q.solution = q.solution || ''; if (q.type === 'text') { q.modelAnswer = q.modelAnswer || ''; q.placeholder = q.placeholder || 'Your answer…'; } });
  let base = 'x-' + slug(c.id || c.title), id = base, n = 2;
  while (CASES.some(k => k.id === id)) id = base + '-' + (n++);
  c.id = id; c.custom = true; c.addedAt = Date.now();
  return c;
}
function addCustomCases(list){
  const added = [];
  list.forEach(raw => { validateCase(raw); const c = normaliseCase(raw); CASES.push(c); added.push(c); });
  saveCustom(); return added;
}
CASES.push(...loadCustom());
store.del('casey-anthropic-key'); store.del('casey-ai-model');

function downloadJSON(name, obj){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type: 'application/json'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function uploadCases(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : Array.isArray(data.cases) ? data.cases : [data];
      const added = addCustomCases(list);
      toast(added.length + (added.length === 1 ? ' case added' : ' cases added'));
      renderHome();
    } catch (e) {
      modal('<h2>Could not add the file</h2><p>' + esc(e.message) + '</p><div class="btns"><button class="pillbtn ghost" data-close>OK</button></div>');
    }
  };
  inp.click();
}

const AI_PROBLEMS = ['Any', 'Profitability', 'Market entry', 'Pricing', 'Growth strategy', 'M&A / valuation', 'Cost reduction', 'New product launch', 'Make vs buy / operations', 'Investment decision'];
function aiDialog(){
  const m = modal('<h2>Create a case with your AI</h2>' +
    '<ol class="steps"><li><b>Choose</b> the kind of case and copy the prompt.</li><li><b>Paste</b> it into ChatGPT, Claude, Gemini or any AI chat.</li><li><b>Copy the whole answer</b> and paste it below. The page turns it into a playable case.</li></ol>' +
    '<form class="aiform" id="ai-form">' +
    '<div class="row2"><label>Problem type<select id="ai-problem">' + AI_PROBLEMS.map(p => '<option>' + esc(p) + '</option>').join('') + '</select></label>' +
    '<label>Industry or twist (optional)<input id="ai-topic" placeholder="e.g. Spanish supermarkets; a relocation that does not pay off"></label></div>' +
    '<label>1 · Prompt to copy<textarea id="ai-prompt" readonly rows="5"></textarea></label>' +
    '<div class="btns"><button class="pillbtn blue" type="button" id="ai-copy">Copy prompt</button></div>' +
    '<label>2 · Paste your AI\'s answer here<textarea id="ai-answer" rows="7" placeholder="Paste the full answer. Extra text or ```json fences around it are fine."></textarea></label>' +
    '<div class="btns"><button class="pillbtn" type="submit">Add case</button><button class="pillbtn ghost" type="button" data-close>Cancel</button></div>' +
    '<div id="ai-status" class="small" aria-live="polite"></div></form>', {wide: true});
  const fill = () => { $('ai-prompt').value = buildCasePrompt($('ai-problem').value, $('ai-topic').value.trim()); };
  $('ai-problem').onchange = fill; $('ai-topic').oninput = fill; fill();
  $('ai-copy').onclick = async () => {
    const t = $('ai-prompt').value;
    try { await navigator.clipboard.writeText(t); } catch (e) { $('ai-prompt').select(); try { document.execCommand('copy'); } catch (e2) {} }
    $('ai-copy').textContent = 'Copied ✓'; setTimeout(() => { if ($('ai-copy')) $('ai-copy').textContent = 'Copy prompt'; }, 1800);
  };
  $('ai-form').onsubmit = (ev) => {
    ev.preventDefault();
    try {
      const list = parseCaseText($('ai-answer').value);
      const added = addCustomCases(list);
      m.close(); renderHome(); toast(added.length === 1 ? 'New case added: ' + added[0].title : added.length + ' cases added');
    } catch (e) { $('ai-status').textContent = e.message; }
  };
}
function parseCaseText(raw){
  let t = String(raw || '').trim();
  if (!t) throw new Error('Paste the answer from your AI first.');
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if (fence && fence[1].includes('{')) t = fence[1];
  t = t.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('No case found in the text. Make sure you copied the whole answer, including the part in curly brackets { }.');
  let body = t.slice(a, b + 1), data;
  try { data = JSON.parse(body); }
  catch (e) {
    try { data = JSON.parse(body.replace(/,\s*([}\]])/g, '$1')); }
    catch (e2) { throw new Error('The answer looks cut off or is not valid JSON. Ask your AI to "send the complete JSON again in one code block" and paste that.'); }

/* ---------------- Scoring ---------------- */
function parseNum(raw){
  let s = String(raw ?? '').trim().replace(/\s+/g,'').replace(/[€$£]/g,'').replace(/%$/,'');
  if (!s) return null;
  if (s.includes(',') && s.includes('.')) s = s.replace(/,/g,'');
  else if (s.includes(',')) { const parts = s.split(','); s = (parts.length === 2 && parts[1].length !== 3) ? parts.join('.') : parts.join(''); }
  s = s.replace('−','-');
  if (!/^[-+]?\d*\.?\d+$/.test(s)) return NaN;
  return parseFloat(s);
}
const isBlank = (ans) => ans === undefined || ans === null || ans === '' || (Array.isArray(ans) && !ans.length);
function scoreQuestion(q, ans, checks){
  if (q.type === 'text') {
    if (isBlank(ans) || !String(ans).trim()) return 0;
    return q.weight * (checks || []).filter(Boolean).length / q.checklist.length;
  }
  if (isBlank(ans)) return 0;
  if (q.type === 'single') return ans === q.correct ? q.weight : 0;
  if (q.type === 'multi') {
    const hits = ans.filter(a => q.correct.includes(a)).length;
    return q.weight * Math.max(0, (hits - (ans.length - hits)) / q.correct.length);
  }
  if (q.type === 'rank') return q.weight * q.correct.filter((id, i) => ans[i] === id).length / q.correct.length;
  if (q.type === 'numeric' && checks && checks.override) return q.weight;
  if (q.type === 'numeric') { const v = parseNum(ans); return (v !== null && !isNaN(v) && Math.abs(v - q.answer) <= q.tolerance + 1e-9) ? q.weight : 0; }
  return 0;
}
function ansOf(a, q){
  const v = a.answers[q.id];
  if (q.type !== 'multi' || !q.legacy || (a.optv || 0) >= 2 || !Array.isArray(v)) return v;
  return v.map(x => q.legacy[x] || x);   // attempts saved before the option shuffle
}
function totals(a){
  const c = caseById(a.caseId); let pts = 0, max = 0;
  c.questions.forEach(q => { max += q.weight; pts += scoreQuestion(q, ansOf(a, q), (a.checks||{})[q.id]); });
  const vw = c.video.weight || 1; max += vw;
  pts += vw * ((a.checks||{}).video || []).filter(Boolean).length / c.video.checklist.length;
  return {pts, max, pct: max ? pts/max*100 : 0};
}
function saveHistory(a){
  const h = store.get(HKEY, []); const t = totals(a);
  const rec = {...a, pts: t.pts, max: t.max, pct: t.pct};
  const i = h.findIndex(x => x.uid === a.uid);
  if (i >= 0) h[i] = rec; else h.unshift(rec);
  store.set(HKEY, h.slice(0, 200));
}

/* ---------------- Exhibits ---------------- */
function exhibitHTML(c, id){
  const ex = c.exhibits[id]; if (!ex) return '';
  let body = '';
  if (ex.kind === 'table') {
    const desc = ex.columns.length === 2 && ex.rows.some(r => String(r[1]).length > 40);
    body = '<div class="ex-scroll"><table class="ex' + (desc ? ' desc' : '') + '"><thead><tr>' + ex.columns.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      ex.rows.map(r => '<tr>' + r.map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  } else if (ex.kind === 'bar') body = barSVG(ex);
  return '<div class="exhibit"><div class="ex-title">' + esc(ex.title) + (ex.unit ? ' (' + esc(ex.unit) + ')' : '') + '</div>' + body + (ex.note ? '<div class="ex-note">' + esc(ex.note) + '</div>' : '') + '</div>';
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return [1,2,4,6,8,10].find(x => n <= x) * p; }
function barSVG(ex){
  const W = 440, H = 220, L = 36, R = 8, T = 14, B = 34;
  const ymax = niceMax(Math.max(...ex.series.flatMap(s => s.values)) * 1.08);
  const cw = (W - L - R) / ex.categories.length, ns = ex.series.length, bw = Math.min(40, (cw * 0.7) / ns);
  const y = v => T + (H - T - B) * (1 - v / ymax);
  const colors = ['#2e8fd8', '#35b56a'];
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = ymax * i / 4; g += '<line class="grid" x1="' + L + '" x2="' + (W-R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L-5) + '" y="' + (y(v)+3.5) + '" text-anchor="end">' + fmtNum(v, Number.isInteger(Math.round(v*1000)/1000) ? 0 : 2) + '</text>'; }
  ex.categories.forEach((cat, ci) => {
    const x0 = L + cw * ci + (cw - bw * ns) / 2;
    ex.series.forEach((s, si) => { const v = s.values[ci], x = x0 + si * bw;
      g += '<rect x="' + (x+1) + '" y="' + y(v) + '" width="' + (bw-2) + '" height="' + (y(0) - y(v)) + '" fill="' + colors[si % 2] + '"/>';
      g += '<text class="val" x="' + (x + bw/2) + '" y="' + (y(v) - 4) + '" text-anchor="middle">' + fmtNum(v, ex.decimals) + '</text>'; });
    g += '<text x="' + (L + cw*ci + cw/2) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + esc(cat) + '</text>';
  });
  const legend = '<div class="legend">' + ex.series.map((s,i) => '<span><i style="background:' + colors[i%2] + '"></i>' + esc(s.name) + '</span>').join('') + '</div>';
  return legend + '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ex.title) + '">' + g + '</svg>';
}

}

const botMsg = (html) => '<div class="msg"><span class="bot-ico" aria-hidden="true"><i></i></span><div class="bubble">' + html + '</div></div>';

  if (!attempt || attempt.status !== 'running') return;
  if (document.hidden) { attempt.flags = attempt.flags || {tab:0,paste:0}; attempt.flags.tab++; store.set(AKEY, attempt); }
  else toast('Tab switch detected (' + attempt.flags.tab + '). The real assessment flags this.');
});

/* ---------------- Video ---------------- */
function startVideo(){
  const c = caseById(attempt.caseId);
  if (!attempt.videoStart) attempt.videoStart = Date.now();
  $('vpanel').innerHTML = '<div class="vq"><span class="bot-ico" aria-hidden="true"><i></i></span><div class="bubble"><div class="qt">Question ' + (c.questions.length + 1) + '</div><p>' + esc(c.video.prompt) + '</p></div></div>' +
    '<div class="vinfo">Recording will start automatically in 1 minute.<br>You have 1 minute to record your answer.</div>' +
    '<div class="vcount" id="vcount"></div><div class="vcam" id="vcam"></div><div class="vinfo" id="vfoot">Please get ready to record your answer!</div>' +
    '<button class="link" id="vhome" style="background:none;border:0;color:#cfd2da;font-size:11px;text-decoration:underline">Back to menu (practice only)</button>';
  $('vhome').onclick = goHome;
  renderDots('vqdots', c.questions.length);
  paintCam(); show('video');
  clearInterval(vtick); vtick = setInterval(videoClock, 250); videoClock();
}
function videoClock(){
  if (!attempt || attempt.status !== 'video') return clearInterval(vtick);
  const t = (Date.now() - attempt.videoStart) / 1000, el = $('vcount');
  const rem = caseById(attempt.caseId).timeLimitMin * 60 - (Date.now() - attempt.startedAt) / 1000; $('vclock').textContent = fmtClock(rem); $('vclock').parentNode.classList.toggle('crit', rem <= 60);
  if (t < 60) { el.className = 'vcount'; el.textContent = 'Recording will start in ' + Math.ceil(60 - t) + 's'; $('vend').hidden = true; }
  else if (t < 120) {
    if (!recorder && camStream && window.MediaRecorder) { try { recChunks = []; recorder = new MediaRecorder(camStream); recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); }; recorder.start(); } catch(e) { recorder = null; } }
    el.className = 'vcount rec'; el.innerHTML = '<span class="rec-dot"></span>Recording · ' + Math.ceil(120 - t) + 's left';
    $('vfoot').textContent = camStream ? 'You are being recorded. One attempt only.' : 'Answer out loud now. One attempt only.'; $('vend').hidden = false;
  } else endVideo();
}
$('vend').onclick = () => { if (attempt && attempt.status === 'video') endVideo(); };
function endVideo(){
  clearInterval(vtick);
  const uid = attempt.uid;
  const finish = () => { stopCam(); attempt.timeUsedSec = Math.min(caseById(attempt.caseId).timeLimitMin * 60, Math.round((Date.now() - attempt.startedAt) / 1000)); attempt.status = 'done'; attempt.finishedAt = Date.now(); store.del(AKEY); saveHistory(attempt); renderResults(); };
  if (recorder && recorder.state !== 'inactive') { recorder.onstop = () => { try { recordings[uid] = URL.createObjectURL(new Blob(recChunks, {type: recorder.mimeType || 'video/webm'})); } catch(e) {} recorder = null; finish(); }; recorder.stop(); }
  else { recorder = null; finish(); }
}

/* ---------------- Results ---------------- */
function verdict(q, ans, pts){
  if (q.type === 'text') return (ans && String(ans).trim()) ? {cls: 'part', label: 'Self-grade'} : {cls: 'bad', label: 'Unanswered'};
  if (q.type === 'numeric' && ((attempt.checks||{})[q.id]||{}).override) return {cls: 'good', label: 'Correct (your override)'};
  if (pts >= q.weight - 1e-9) return {cls: 'good', label: 'Correct'};
  if (isBlank(ans)) return {cls: 'bad', label: 'Unanswered'};
  if (pts > 0) return {cls: 'part', label: 'Partly correct'};
  return {cls: 'bad', label: 'Wrong'};
}
function correctText(q){
  const t = (id) => 'Option ' + id + ' — ' + q.options.find(o => o.id === id).text;
  if (q.type === 'single') return t(q.correct);
  if (q.type === 'multi') return q.correct.map(t).join('\n');
  if (q.type === 'rank') return q.correct.map((id, i) => (i+1) + '. ' + t(id)).join('\n');
  if (q.type === 'numeric') return fmtNum(q.answer, 2) + ' ' + (q.unit || '') + '\n(accepted: ' + fmtNum(q.answer - q.tolerance, 2) + ' to ' + fmtNum(q.answer + q.tolerance, 2) + ')';
  return q.modelAnswer;
}
function checklistHTML(key, items){
  const ch = (attempt.checks || {})[key] || [];
  return '<div class="checklist">' + items.map((it, i) => '<label><input type="checkbox" id="ck-' + esc(key) + '-' + i + '" data-ck="' + esc(key) + '" data-i="' + i + '"' + (ch[i] ? ' checked' : '') + '><span>' + esc(it) + '</span></label>').join('') + '</div>';
}
const barLabel = (p) => p >= 70 ? 'Above the ~70% candidate-reported bar' : p >= 60 ? 'Borderline' : 'Below the ~70% candidate-reported bar';
function renderResults(){
  const c = caseById(attempt.caseId), t = totals(attempt), p = Math.round(t.pct);
  const auto = c.questions.filter(q => q.type !== 'text');
  const autoPts = auto.reduce((s,q) => s + scoreQuestion(q, ansOf(attempt, q)), 0), autoMax = auto.reduce((s,q) => s + q.weight, 0);
  const fl = attempt.flags || {tab: 0, paste: 0};
  let html = '<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end"><div><span class="eyebrow">Results · ' + esc(fmtDate(attempt.startedAt)) + '</span><h1 style="font-size:26px">' + esc(c.title) + '</h1></div><button class="pillbtn ghost" id="home-btn">All cases</button></div>';
  html += '<div class="score-row">' +
    '<div class="stat"><div class="l">Score</div><div class="v" id="score-pct">' + p + '%</div><span class="tag ' + (p >= 70 ? 'good' : p >= 60 ? 'warn' : 'bad') + '" id="score-pill">' + barLabel(p) + '</span></div>' +
    '<div class="stat"><div class="l">Points</div><div class="v" id="score-pts">' + fmtNum(t.pts, 1) + ' / ' + fmtNum(t.max, 1) + '</div><span class="hint">Auto-graded ' + fmtNum(autoPts,1) + ' / ' + fmtNum(autoMax,1) + '</span></div>' +
    '<div class="stat"><div class="l">Time used (incl. video)</div><div class="v">' + fmtClock(attempt.timeUsedSec || 0) + '</div><span class="hint">of ' + c.timeLimitMin + ':00</span></div>' +
    '<div class="stat"><div class="l">Proctoring flags</div><div class="v">' + (fl.tab + fl.paste) + '</div><span class="hint">' + fl.tab + ' tab switches · ' + fl.paste + ' paste attempts</span></div></div>';
  html += '<p class="muted" style="margin:0;font-size:13px">Written answers and the video score zero until you tick the checklist items your answer actually covers. The score updates as you tick. The real test does not show a score; the 70% bar is a candidate estimate.</p>';
  c.questions.forEach((q, i) => {
    const ans = ansOf(attempt, q), pts = scoreQuestion(q, ans, (attempt.checks||{})[q.id]), v = verdict(q, ans, pts);
    html += '<section class="rq ' + v.cls + '"><div class="rq-h"><h3>Q' + (i+1) + '. ' + esc(q.prompt) + '</h3><span class="tag ' + (v.cls === 'part' ? 'warn' : v.cls) + '" data-pts="' + esc(q.id) + '">' + v.label + ' · ' + fmtNum(pts, 2) + '/' + fmtNum(q.weight, 1) + '</span></div>' +
      '<div class="cmp"><div><span class="lab">Your answer</span>' + esc(answerText(q, ans)) + '</div><div><span class="lab">' + (q.type === 'text' ? 'Model answer' : 'Correct answer') + '</span>' + esc(correctText(q)) + '</div></div>' +
      (q.type === 'text' ? '<div><span class="eyebrow">A strong answer includes</span>' + checklistHTML(q.id, q.checklist) + '</div>' : '') +
      (q.type === 'numeric' && !isBlank(ans) && (v.cls === 'bad' || ((attempt.checks||{})[q.id]||{}).override) ? '<div><button class="pillbtn ghost" data-ov="' + esc(q.id) + '" style="font-size:12px;padding:5px 12px">' + (((attempt.checks||{})[q.id]||{}).override ? 'Undo override' : 'Count as correct (input or rounding issue)') + '</button></div>' : '') +
      '<div class="solution"><b>Fastest route.</b> ' + esc(q.solution) + '</div></section>';
  });
  const vp = c.video.weight * ((attempt.checks||{}).video || []).filter(Boolean).length / c.video.checklist.length;
  html += '<section class="rq part"><div class="rq-h"><h3>Video. ' + esc(c.video.prompt) + '</h3><span class="tag warn" data-pts="video">Self-graded · ' + fmtNum(vp, 2) + '/' + fmtNum(c.video.weight, 1) + '</span></div>' +
    (recordings[attempt.uid] ? '<video class="playback" controls src="' + recordings[attempt.uid] + '"></video><span class="hint">Your recording is kept only until you close this page.</span>' : '') +
    '<div class="cmp"><div><span class="lab">Model one-minute answer</span>' + esc(c.video.modelAnswer) + '</div></div><div><span class="eyebrow">Tick what you actually said</span>' + checklistHTML('video', c.video.checklist) + '</div></section>';
  html += '<details class="ex-all"><summary>All exhibits for this case</summary><div>' + Object.keys(c.exhibits).map(id => exhibitHTML(c, id)).join('') + '</div></details>';
  html += '<div><button class="pillbtn blue" id="again">Try another case</button></div>';
  $('results').innerHTML = html;
  $('home-btn').onclick = renderHome; $('again').onclick = renderHome;
  $('results').querySelectorAll('[data-ov]').forEach(b => b.onclick = () => {
    const k = b.dataset.ov; attempt.checks = attempt.checks || {};
    if ((attempt.checks[k]||{}).override) delete attempt.checks[k]; else attempt.checks[k] = {override: true};
    saveHistory(attempt); const y = window.scrollY; renderResults(); window.scrollTo(0, y);
  });
  $('results').querySelectorAll('[data-ck]').forEach(cb => cb.onchange = () => {
    const k = cb.dataset.ck; attempt.checks = attempt.checks || {};
    const arr = attempt.checks[k] = attempt.checks[k] || []; arr[+cb.dataset.i] = cb.checked;
    saveHistory(attempt);
    const tt = totals(attempt), pp = Math.round(tt.pct);
    $('score-pct').textContent = pp + '%'; $('score-pts').textContent = fmtNum(tt.pts,1) + ' / ' + fmtNum(tt.max,1);
    const pill = $('score-pill'); pill.className = 'tag ' + (pp >= 70 ? 'good' : pp >= 60 ? 'warn' : 'bad'); pill.textContent = barLabel(pp);
    const q = c.questions.find(x => x.id === k);
    const pts = q ? scoreQuestion(q, ansOf(attempt, q), attempt.checks[k]) : c.video.weight * arr.filter(Boolean).length / c.video.checklist.length;
    $('results').querySelector('[data-pts="' + k + '"]').textContent = (q ? 'Self-grade' : 'Self-graded') + ' · ' + fmtNum(pts,2) + '/' + fmtNum(q ? q.weight : c.video.weight,1);
  });
  show('results');
}

/* ---------------- Boot ---------------- */
const active = store.get(AKEY, null);
if (active && caseById(active.caseId) && (active.status === 'running' || active.status === 'video')) { attempt = active; attempt.shown = attempt.shown || {}; resumeAttempt(); }
else { store.del(AKEY); renderHome(); }
})();
</script>
</body></html>
